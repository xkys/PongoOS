name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # 使用最新的LTS版本
    steps:
      - name: Install toolchain
        run: |
          # 添加checkra1n仓库
          echo 'deb https://assets.checkra.in/debian /' | sudo tee /etc/apt/sources.list.d/checkra1n.list
          sudo wget -O /etc/apt/trusted.gpg.d/checkra1n.gpg https://assets.checkra.in/debian/archive.key
          
          # 添加LLVM官方仓库（获取更新的工具链）
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 18
          
          sudo apt-get update
          sudo apt-get install -y \
            ld64 \
            cctools-strip \
            clang-18 \
            llvm-18 \
            lld-18 \
            lldb-18 \
            llvm-18-dev \
            llvm-18-runtime \
            libc++-18-dev \
            libc++abi-18-dev

      - name: Checkout repository
        uses: actions/checkout@v4  # 使用最新版本
        with:
          submodules: recursive
          fetch-depth: 0  # 获取完整历史记录

      - name: Update repository
        run: |
          git fetch --all
          git reset --hard origin/$(git branch --show-current)
          git submodule update --recursive --remote

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            build
          key: ${{ runner.os }}-build-${{ hashFiles('Makefile', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Compile
        run: |
          export EMBEDDED_CC='clang-18'
          export EMBEDDED_AR='llvm-ar-18'
          export EMBEDDED_RANLIB='llvm-ranlib-18'
          make clean
          make all

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PongoOS
          path: |
            build/checkra1n-kpf-pongo
            build/Pongo
            build/Pongo.bin
            build/PongoConsolidated.bin
          retention-days: 7
